<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Stalk Quil</title>
  <!-- No indexing for admin -->
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">Stalk Quil</div>
      <div class="login-subtitle">Admin Access</div>

      <div class="error-msg" id="loginError"></div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="loginEmail" placeholder="admin@blog.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn btn-primary btn-full" id="loginBtn" onclick="doLogin()">
        Sign In
      </button>
    </div>
  </div>

  <!-- ADMIN APP (shown after login) -->
  <div id="admin-app">
    <div class="admin-layout">

      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-logo">Stalk Quil</span>
          <span class="sidebar-badge">Admin</span>
        </div>

        <nav class="sidebar-nav">
          <div class="sidebar-section-label">Content</div>

          <div class="sidebar-link active" id="nav-dashboard" onclick="showDashboard()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
            </svg>
            Dashboard
          </div>

          <div class="sidebar-link" id="nav-articles" onclick="showArticles()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
            </svg>
            Articles
          </div>

          <div class="sidebar-link" id="nav-new" onclick="showEditor()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            New Article
          </div>

          <div class="sidebar-section-label">Account</div>

          <div class="sidebar-link" id="nav-settings" onclick="showSettings()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Settings
          </div>

          <a class="sidebar-link" href="/" target="_blank">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
            View Blog
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-user">
            <div class="sidebar-avatar" id="sidebarAvatar">A</div>
            <div>
              <div class="sidebar-user-name" id="sidebarName">Admin</div>
              <div class="sidebar-user-role">Administrator</div>
            </div>
          </div>
          <button class="btn btn-ghost btn-full" onclick="doLogout()" style="justify-content:flex-start;gap:8px;font-size:13px;color:var(--text-3)">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sign Out
          </button>
        </div>
      </aside>

       <!-- MAIN -->
       <div class="admin-main">
         <div class="admin-topbar">
           <div class="topbar-left">
             <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">
               <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                 <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
               </svg>
             </button>
             <div class="topbar-title" id="topbarTitle">Dashboard</div>
           </div>
           <div class="topbar-actions" id="topbarActions"></div>
         </div>
         <div class="admin-content" id="adminContent">
           <div class="admin-loading"><div class="spinner"></div> Loading…</div>
         </div>
       </div>

     </div>
   </div>

   <!-- Mobile Sidebar Overlay -->
   <div class="mobile-sidebar-overlay" id="mobileSidebarOverlay">
     <aside class="sidebar mobile-sidebar" id="mobileSidebar">
       <div class="sidebar-header">
         <span class="sidebar-logo">Stalk Quil</span>
         <span class="sidebar-badge">Admin</span>
       </div>
       <nav class="sidebar-nav">
         <div class="sidebar-section-label">Content</div>
         <div class="sidebar-link active" id="nav-dashboard-mobile" onclick="showDashboard(); closeMobileSidebar()">
           Dashboard
         </div>
         <div class="sidebar-link" id="nav-articles-mobile" onclick="showArticles(); closeMobileSidebar()">
           Articles
         </div>
         <div class="sidebar-link" id="nav-new-mobile" onclick="showEditor(); closeMobileSidebar()">
           New Article
         </div>
         <div class="sidebar-section-label">Account</div>
         <div class="sidebar-link" id="nav-settings-mobile" onclick="showSettings(); closeMobileSidebar()">
           Settings
         </div>
         <a class="sidebar-link" href="/" target="_blank" onclick="closeMobileSidebar()">
           View Blog
         </a>
       </nav>
       <div class="sidebar-footer">
         <div class="sidebar-user">
           <div class="sidebar-avatar" id="sidebarAvatarMobile">A</div>
           <div>
             <div class="sidebar-user-name" id="sidebarNameMobile">Admin</div>
             <div class="sidebar-user-role">Administrator</div>
           </div>
         </div>
         <button class="btn btn-ghost btn-full" onclick="doLogout(); closeMobileSidebar()" style="justify-content:flex-start;gap:8px;font-size:13px;color:var(--text-3)">
           Sign Out
         </button>
       </div>
     </aside>
   </div>

  <!-- CONFIRM MODAL -->
  <div class="modal-backdrop" id="confirmModal">
    <div class="modal">
      <div class="modal-title" id="modalTitle">Are you sure?</div>
      <div class="modal-body" id="modalBody">This action cannot be undone.</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" id="modalConfirmBtn">Delete</button>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/admin/admin.js"></script>
</body>
</html>
